  <!-- Notebook Header Box -->
  <g font-family="'Caveat', cursive" font-size="14" fill="#64748b">
    <text x="610" y="60">Page No: <tspan font-weight="700" fill="#0f172a">GT-06</tspan></text>
    <text x="610" y="90">Date: <tspan fill="#0f172a">05 / 11 / 2026</tspan></text>
    <text x="40" y="70" font-size="13" fill="#94a3b8">LipiScript Benchmark [Hindi]</text>
    <text x="40" y="92" font-size="11" fill="#cbd5e1">Broken shirorekha, quick cursive, doctor-style handwriting</text>
  </g>

  <!-- Handwritten Body Content -->
  <g transform="rotate(0.35 400 550)">
    
      <text x="135" y="170" font-family="'Kalam', cursive, sans-serif" font-size="22" font-weight="700" fill="#0f172a">
        GT-06 Ground-Truth Transcript (Hindi - Difficult)
      </text>
    
      <text x="135" y="238" font-family="'Kalam', cursive, sans-serif" font-size="18" font-weight="400" fill="#0f172a">
        मानव शरीर में प्रतिरोधक क्षमता का संतुलन बनाए रखना स्वास्थ्य की पहली शर्त है। अत्यधिक तनाव और असंतुलित खान-पान से चयापचय प्रक्रिया बाधित होती है।
      </text>
    
      <text x="135" y="306" font-family="'Kalam', cursive, sans-serif" font-size="18" font-weight="400" fill="#0f172a">
        चिकित्सीय निष्कर्ष:
      </text>
    
      <text x="135" y="340" font-family="'Kalam', cursive, sans-serif" font-size="18" font-weight="400" fill="#0f172a">
        रक्तचाप और शर्करा स्तर की नियमित जांच से कई गंभीर व्याधियों से बचाव संभव है। जब शरीर में ..... की मात्रा असामान्य रूप से बढ़ जाती है, तब तत्काल औषधीय परामर्श लेना आवश्यक हो जाता है।
      </text>
    
      <text x="135" y="408" font-family="'Kalam', cursive, sans-serif" font-size="18" font-weight="400" fill="#0f172a">
        पर्याप्त नींद और नियमित योगाभ्यास से मानसिक एकाग्रता में वृद्धि होती है।
      </text>
    
    
      <g opacity="0.88">
        <ellipse cx="320" cy="302" rx="34" ry="16" fill="#0f172a" />
        <ellipse cx="328" cy="298" rx="22" ry="12" fill="#1e3a8a" filter="blur(1px)" />
        <circle cx="355" cy="312" r="5" fill="#0f172a" />
        <circle cx="288" cy="306" r="3.5" fill="#1e3a8a" />
      </g>
    
    
  </g>
