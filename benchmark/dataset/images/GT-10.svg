<line x1="20" y1="718" x2="780" y2="718" stroke="#bfdbfe" stroke-width="1.2" stroke-dasharray="none" />
<line x1="20" y1="752" x2="780" y2="752" stroke="#bfdbfe" stroke-width="1.2" stroke-dasharray="none" />
<line x1="20" y1="786" x2="780" y2="786" stroke="#bfdbfe" stroke-width="1.2" stroke-dasharray="none" />
