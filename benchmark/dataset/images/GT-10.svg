<line x1="20" y1="1024" x2="780" y2="1024" stroke="#bfdbfe" stroke-width="1.2" stroke-dasharray="none" />

  
    <line x1="120" y1="20" x2="120" y2="1080" stroke="#fca5a5" stroke-width="1.4" />
    <line x1="124" y1="20" x2="124" y2="1080" stroke="#fca5a5" stroke-width="1.4" />
    <line x1="20" y1="120" x2="780" y2="120" stroke="#fca5a5" stroke-width="1.4" />
  

  <!-- Notebook Header Box -->
  <g font-family="'Caveat', cursive" font-size="14" fill="#64748b">
    <text x="610" y="60">Page No: <tspan font-weight="700" fill="#0f172a">GT-10</tspan></text>
    <text x="610" y="90">Date: <tspan fill="#0f172a">05 / 11 / 2026</tspan></text>
    <text x="40" y="70" font-size="13" fill="#94a3b8">LipiScript Benchmark [Mixed-Language]</text>
    <text x="40" y="92" font-size="11" fill="#cbd5e1">Mixed script with hand-drawn tables and annotated diagrams</text>
  </g>

  <!-- Handwritten Body Content -->
  <g transform="rotate(0.35 400 550)">
    
      <text x="135" y="170" font-family="'Kalam', cursive, sans-serif" font-size="22" font-weight="700" fill="#1e3a8a">
        GT-10 Ground-Truth Transcript (Mixed-Language - Difficult)
      </text>
    
      <text x="135" y="238" font-family="'Kalam', cursive, sans-serif" font-size="18" font-weight="400" fill="#1e3a8a">
        RDBMS architecture मध्ये relational schema आणि normalization अत्यंत महत्त्वाचे मानले जातात.
      </text>
    
      <text x="135" y="306" font-family="'Kalam', cursive, sans-serif" font-size="18" font-weight="400" fill="#1e3a8a">
        | Component | Function | Memory Type |
      </text>
    
      <text x="135" y="340" font-family="'Kalam', cursive, sans-serif" font-size="18" font-weight="400" fill="#1e3a8a">
        |---|---|---|
      </text>
    
      <text x="135" y="374" font-family="'Kalam', cursive, sans-serif" font-size="18" font-weight="400" fill="#1e3a8a">
        | Buffer Pool | Caching disk pages | Volatile RAM |
      </text>
    
      <text x="135" y="408" font-family="'Kalam', cursive, sans-serif" font-size="18" font-weight="400" fill="#1e3a8a">
        | Redo Log | Crash recovery &amp; durability | Non-volatile Disk |
      </text>
    
      <text x="135" y="442" font-family="'Kalam', cursive, sans-serif" font-size="18" font-weight="400" fill="#1e3a8a">
        | Query Optimizer | Cost-based plan generation | CPU Cache |
      </text>
    
      <text x="135" y="510" font-family="'Kalam', cursive, sans-serif" font-size="18" font-weight="400" fill="#1e3a8a">
        लक्षात ठेवा: ACID properties पैकी Isolation level ठरवताना ..... concurrency anomalies निर्माण होऊ नयेत याची काळजी घ्यावी लागते.
      </text>
    
      <text x="135" y="578" font-family="'Kalam', cursive, sans-serif" font-size="22" font-weight="700" fill="#1e3a8a">
        Diagram Labels
      </text>
    
      <text x="135" y="612" font-family="'Kalam', cursive, sans-serif" font-size="18" font-weight="400" fill="#1e3a8a">
        Client Application Interface
      </text>
    
      <text x="135" y="646" font-family="'Kalam', cursive, sans-serif" font-size="18" font-weight="400" fill="#1e3a8a">
        SQL Parser &amp; Semantic Checker
      </text>
    
      <text x="135" y="680" font-family="'Kalam', cursive, sans-serif" font-size="18" font-weight="400" fill="#1e3a8a">
        Storage Engine Layer
      </text>
    
      <text x="135" y="714" font-family="'Kalam', cursive, sans-serif" font-size="18" font-weight="400" fill="#1e3a8a">
        Data Files (*.ibd)
      </text>
    
    
      <g opacity="0.88">
        <ellipse cx="320" cy="302" rx="34" ry="16" fill="#0f172a" />
        <ellipse cx="328" cy="298" rx="22" ry="12" fill="#1e3a8a" filter="blur(1px)" />
        <circle cx="355" cy="312" r="5" fill="#0f172a" />
        <circle cx="288" cy="306" r="3.5" fill="#1e3a8a" />
      </g>
    
    
      <g stroke="#1e3a8a" stroke-width="1.8" fill="none" transform="translate(160, 802)">
        <!-- Hand-drawn block diagram sketch -->
        <rect x="20" y="20" width="120" height="50" rx="8" stroke-dasharray="2,1" />
        <text x="35" y="50" font-family="'Kalam', cursive, sans-serif" font-size="14" fill="#1e3a8a">Input Layer</text>
        
        <line x1="140" y1="45" x2="190" y2="45" marker-end="url(#arrow)" />
        
        <rect x="190" y="20" width="140" height="50" rx="8" />
        <text x="205" y="50" font-family="'Kalam', cursive, sans-serif" font-size="14" fill="#1e3a8a">Shaping Engine</text>
        
        <line x1="330" y1="45" x2="380" y2="45" marker-end="url(#arrow)" />
        
        <rect x="380" y="20" width="120" height="50" rx="8" />
        <text x="395" y="50" font-family="'Kalam', cursive, sans-serif" font-size="14" fill="#1e3a8a">Vector PDF</text>
      </g>
    
  </g>
