  <!-- Notebook Header Box -->
  <g font-family="'Caveat', cursive" font-size="14" fill="#64748b">
    <text x="610" y="60">Page No: <tspan font-weight="700" fill="#0f172a">GT-03</tspan></text>
    <text x="610" y="90">Date: <tspan fill="#0f172a">05 / 11 / 2026</tspan></text>
    <text x="40" y="70" font-size="13" fill="#94a3b8">LipiScript Benchmark [Marathi]</text>
    <text x="40" y="92" font-size="11" fill="#cbd5e1">Cursive slant, broken lines, ink fading</text>
  </g>

  <!-- Handwritten Body Content -->
  <g transform="rotate(0.35 400 550)">
    
      <text x="135" y="170" font-family="'Kalam', cursive, sans-serif" font-size="22" font-weight="700" fill="#1e3a8a">
        GT-03 Ground-Truth Transcript (Marathi - Difficult)
      </text>
    
      <text x="135" y="238" font-family="'Kalam', cursive, sans-serif" font-size="18" font-weight="400" fill="#1e3a8a">
        मनुष्याच्या जीवनात संयम आणि कष्टाची जोड असल्याशिवाय यश संपादन करणे अशक्य आहे. आजच्या धावपळीच्या युगात आपण आपल्या मूळ मूल्यांकडे दुर्लक्ष करत आहोत.
      </text>
    
      <text x="135" y="306" font-family="'Kalam', cursive, sans-serif" font-size="18" font-weight="400" fill="#1e3a8a">
        संध्याकाळच्या वेळी नदीकाठी बसून विचार करताना जाणवले की ..... टिकवून ठेवणे हीच खरी साधना आहे. बाह्य परिस्थिती कितीही प्रतिकूल असली तरी अंतर्मनाची शांतता ढळू देऊ नये.
      </text>
    
      <text x="135" y="374" font-family="'Kalam', cursive, sans-serif" font-size="18" font-weight="400" fill="#1e3a8a">
        निसर्गाचे नियम त्रिकालाबाधित आहेत. जे पेराल तेच उगवते, हा सनातन सिद्धांत प्रत्येकाने लक्षात ठेवला पाहिजे.
      </text>
    
    
      <g opacity="0.88">
        <ellipse cx="320" cy="302" rx="34" ry="16" fill="#0f172a" />
        <ellipse cx="328" cy="298" rx="22" ry="12" fill="#1e3a8a" filter="blur(1px)" />
        <circle cx="355" cy="312" r="5" fill="#0f172a" />
        <circle cx="288" cy="306" r="3.5" fill="#1e3a8a" />
      </g>
    
    
  </g>
