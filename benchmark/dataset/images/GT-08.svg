  </g>

  <!-- Handwritten Body Content -->
  <g transform="rotate(0 400 550)">
    
      <text x="135" y="170" font-family="'Caveat', cursive" font-size="22" font-weight="700" fill="#1e3a8a">
        GT-08 Ground-Truth Transcript (English - Moderate)
      </text>
    
      <text x="135" y="238" font-family="'Caveat', cursive" font-size="18" font-weight="400" fill="#1e3a8a">
        The propagation of electromagnetic waves in a vacuum is governed by Maxwell&apos;s equations. In differential form, these relationships are expressed as:
      </text>
    
      <text x="135" y="306" font-family="'Caveat', cursive" font-size="18" font-weight="400" fill="#1e3a8a">
        $$ \nabla \cdot \vec{E} = \frac{\rho}{\epsilon_0} $$
      </text>
    
      <text x="135" y="340" font-family="'Caveat', cursive" font-size="18" font-weight="400" fill="#1e3a8a">
        $$ \nabla \cdot \vec{B} = 0 $$
      </text>
    
      <text x="135" y="374" font-family="'Caveat', cursive" font-size="18" font-weight="400" fill="#1e3a8a">
        $$ \nabla \times \vec{E} = -\frac{\partial \vec{B}}{\partial t} $$
      </text>
    
      <text x="135" y="408" font-family="'Caveat', cursive" font-size="18" font-weight="400" fill="#1e3a8a">
        $$ \nabla \times \vec{B} = \mu_0 \vec{J} + \mu_0 \epsilon_0 \frac{\partial \vec{E}}{\partial t} $$
      </text>
    
      <text x="135" y="476" font-family="'Caveat', cursive" font-size="18" font-weight="400" fill="#1e3a8a">
        Taking the curl of both sides leads to the second-order wave equation:
      </text>
    
      <text x="135" y="510" font-family="'Caveat', cursive" font-size="18" font-weight="400" fill="#1e3a8a">
        $$ \nabla^2 \vec{E} - \frac{1}{c^2} \frac{\partial^2 \vec{E}}{\partial t^2} = 0 $$
      </text>
    
      <text x="135" y="578" font-family="'Caveat', cursive" font-size="18" font-weight="400" fill="#1e3a8a">
        Here, the speed of light $c = \frac{1}{\sqrt{\mu_0 \epsilon_0}}$, confirming light as an electromagnetic phenomenon.
      </text>
    
    
    
  </g>
